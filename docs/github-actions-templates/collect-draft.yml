name: Collect Draft
on:
  workflow_dispatch:
  schedule:
    - cron: '30 22 * * *'
    - cron: '30 7 * * *'
permissions:
  contents: write
  pull-requests: write
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'npm' }
      - run: npm ci
      - run: npm run pipeline:fixture
      - run: npm run qa
      - run: echo "Fixture mode only. Real branch/PR creation requires operator approval and secret setup."
