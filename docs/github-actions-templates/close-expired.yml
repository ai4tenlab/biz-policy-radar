name: Close Expired Draft
on:
  workflow_dispatch:
  schedule:
    - cron: '10 15 * * *'
permissions:
  contents: write
  pull-requests: write
jobs:
  close-expired:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'npm' }
      - run: npm ci
      - run: node scripts/close-expired/close-expired.mjs
